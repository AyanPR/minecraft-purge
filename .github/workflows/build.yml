name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'   # pon la que use tu build.gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: chmod +x gradlew && ./gradlew build

      - name: Save the jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-purge
          path: build/libs/*.jar
