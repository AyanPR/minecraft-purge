plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'maven-publish'
}

group 'dev.josantonius.minecraft.purge'
version '1.0.3'

ext {
    _name = 'purge'
    _server = 'paper'
    _api = '26.1.2'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${_api}.build.+")
    compileOnly('net.luckperms:api:5.5')
    implementation('dev.josantonius:minecraft-messaging:v1.1.0')
}

// jvmToolchain configura automáticamente tanto las tareas de Kotlin
// como las de Java para usar JDK 25, evitando el típico error de
// "Inconsistent JVM-target compatibility" entre compileJava y compileKotlin.
kotlin {
    jvmToolchain(25)
}

jar {
    manifest {
        attributes 'Main-Class': 'dev.josantonius.minecraft.purge.Main'
    }
    exclude('.github/**')
    exclude('libs/**')
    exclude('.gitignore')
    exclude('.CHANGELOG.md')
    exclude('README.md')
    exclude('LICENSE')
}

shadowJar {
    archiveClassifier.set('all')
    archiveFileName.set("${_name}-${version}-${_server}-${_api}.jar")
    mergeServiceFiles()
    append('META-INF/licenses/')
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.MF'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
    options.release = 25
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'dev.josantonius.minecraft.purge'
            artifactId = 'minecraft-plugin'
            version = project.version
            pom {
                name = 'Minecraft Purge Plugin'
                description = 'Purge plugin for Minecraft'
                url = 'https://github.com/josantonius/minecraft-purge'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://github.com/josantonius/minecraft-purge/blob/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'josantonius'
                        name = 'Josantonius'
                        email = 'hello@josantonius.dev'
                    }
                }
            }

            from components.java
        }
    }
}